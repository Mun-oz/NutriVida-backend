# Configuracion de NutriVida para AWS

# Puerto del backend
server.port=8080

# Conexion con Amazon RDS
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Base de datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Frontend alojado en Amazon S3
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Estado de la aplicacion
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Cuenta inicial del administrador
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}