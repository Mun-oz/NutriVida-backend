spring.application.name=nutrivida-backend
server.port=8080

# Conexion a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutrivida_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Manejo de errores HTTP
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}

# Access token: 1 hora
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Refresh token: 7 dias
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS para el frontend React
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}